# Local Docker usage:
#
#   docker compose up --build
#     -> app ko HF_MODEL_REPO_ID / HUGGINGFACEHUB_API_TOKEN (Hugging Face
#        Inference Providers) ke through .env se run karta hai.

services:
  app:
    build: .
    ports:
      - "8000:7860"
    env_file:
      - .env
    environment:
      - PORT=7860